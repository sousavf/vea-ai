[workspace]
members = ["apps/desktop/src-tauri", "crates/vea-policy", "crates/vea-store"]
resolver = "2"

[workspace.package]
edition = "2024"
license = "MIT"
rust-version = "1.94"

[workspace.dependencies]
fs2 = "0.4.3"
hex = "0.4.3"
rusqlite = { version = "0.39.0", features = ["backup", "bundled"] }
same-file = "1.0.6"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10.9"
thiserror = "2"
uuid = { version = "1.24.0", features = ["serde", "v7"] }
